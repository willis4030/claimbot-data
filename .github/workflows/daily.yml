name: Daily scrape

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6 AM Chicago in summer, 5 AM in winter)
  workflow_dispatch:        # adds a "Run workflow" button to run it now

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape
        run: python scraper/run.py
      - name: Save results
        run: |
          git config user.name "claimbot-bot"
          git config user.email "claimbot-bot@users.noreply.github.com"
          git add settlements.json data/cache.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update settlements $(date -u +%Y-%m-%d)"
            git push
          fi
